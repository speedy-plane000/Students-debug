<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Проекты — Контур</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<main class="content">
		<div class="page-head">
			<div><h1>Проекты</h1><p class="sub">Общее пространство для команды, кода и задач.</p></div>
			<div class="head-actions">
				<button class="btn" type="button" data-open="modal-join">Войти в проект</button>
				<a class="btn btn-primary" href="project-new.html"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Создать проект</a>
			</div>
		</div>
		<div class="alert alert-success" id="welcome"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.8 2.8L16 9.5"/></svg><div><b>Вы вошли в систему</b><span id="welcome-text"></span></div></div>
		<div class="list-head">
			<h2 id="projects-title">Все проекты</h2>
			<div><input class="input inline-search" id="project-search" placeholder="Название или код проекта" aria-label="Поиск проектов"><button class="btn btn-sm" id="search-toggle" type="button"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Поиск проектов</button></div>
		</div>
		<section class="projects" id="projects"></section>
	</main>

	<div class="overlay" id="modal-join" role="dialog" aria-modal="true" aria-labelledby="modal-join-t">
		<div class="modal">
			<div class="modal-head"><h2 id="modal-join-t">Войти в проект</h2><button class="modal-x" type="button" data-close aria-label="Закрыть"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
			<p class="lead">Введите код приглашения, полученный от руководителя проекта. Проект появится в вашем списке.</p>
			<div class="field" id="invite-field"><label for="invite-code">Код приглашения</label>
				<input class="input" id="invite-code" placeholder="PRJ-XXXX-XXXX" autocomplete="off">
				<div class="hint">Код указан в приглашении в проект.</div><div class="field-error">Неверный код приглашения</div></div>
			<div class="modal-foot"><button class="btn" type="button" data-close>Отмена</button><button class="btn btn-primary" id="join-confirm" type="button">Подтвердить</button></div>
		</div>
	</div>
	<script src="js/store.js"></script>
	<script src="js/ui.js"></script>
	<script src="js/pages/projects.js"></script>
</body>
</html>
